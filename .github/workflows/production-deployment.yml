name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-api
  CONTAINER_APP_PROD: play14-api
  RESOURCE_GROUP: play14-community

jobs:
  build-production:
    name: Build Production Image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.PLAY14API_REGISTRY_USERNAME }}
          password: ${{ secrets.PLAY14API_REGISTRY_PASSWORD }}

      - name: Build and push production container image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: ./Dockerfile
          context: ./
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN=${{ secrets.STRAPI_ADMIN_MAPBOX_ACCESS_TOKEN }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PLAY14API_AZURE_CREDENTIALS }}

      - name: Deploy to Production Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              -n ${{ env.CONTAINER_APP_PROD }} \
              -g ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
